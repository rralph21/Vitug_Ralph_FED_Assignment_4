<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancun Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="survey-box">
      <h1>Cancun Trip</h1>

    <form action="https://httpbin.org/post" method="POST" novalidate>
        <div class="group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" />
            <span class="error-text" id="err-name"></span>
        </div>

        <div class="group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
            <span class="error-text" id="err-email"></span>
        </div>

        <div class="group">
            <label for="username">Username (3 to 16 letters, numbers, or _)</label>
            <input id="username" name="username" type="text" />
            <span class="error-text" id="err-username"></span>
        </div>

         <fieldset>
          <legend>Is Cancun worth it?</legend>
          <label><input type="radio" name="worth" value="yes"> Yes</label>
          <label><input type="radio" name="worth" value="no"> No</label>
          <label><input type="radio" name="worth" value="unsure"> Unsure</label>
          <span class="error-text" id="err-worth"></span>
        </fieldset>

        <fieldset>
          <legend>Top reasons it would be worth it</legend>
          <label><input type="checkbox" name="interest" value="beaches"> Beaches</label>
          <label><input type="checkbox" name="interest" value="food"> Food</label>
          <label><input type="checkbox" name="interest" value="nightlife"> Nightlife</label>
          <label><input type="checkbox" name="interest" value="culture"> Culture</label>
          <label><input type="checkbox" name="interest" value="weather"> Weather</label>
          <span class="error-text" id="err-interest"></span>
        </fieldset>

         <div class="group">
          <label for="focus">Main trip focus</label>
          <select id="focus" name="focus">
            <option value="">Select one</option>
            <option value="relaxation">Relaxation</option>
            <option value="adventure">Adventure</option>
            <option value="nightlife">Nightlife</option>
            <option value="family">Family</option>
            <option value="culture">Culture</option>
          </select>
          <span class="error-text" id="err-focus"></span>
        </div>

        <div class="group">
          <label for="date">Planned date</label>
          <input id="date" name="date" type="date">
          <span class="error-text" id="err-date"></span>
        </div>

        <div class="group">
          <label for="budget">Estimated budget per person (CAD)</label>
          <input id="budget" name="budget" type="number" min="100" max="20000" step="50">
          <span class="error-text" id="err-budget"></span>
        </div>

        <div class="group">
          <label for="comments">Why or why not?</label>
          <textarea id="comments" name="comments" placeholder="Write your answer here..."></textarea>
          <span class="error-text" id="err-comments"></span>
        </div>

        <div class="actions">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>
    </form>

    <script src="script.js"></script>
  </main>
</body>
</html>
