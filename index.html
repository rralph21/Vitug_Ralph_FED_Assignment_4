<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancun Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="survey-box">
      <h1>Cancun Trip</h1>

    <form action="https://httpbin.org/post" method="POST" novalidate>
        <div class="group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" />
            <span class="error-text" id="err-name"></span>
        </div>

        <div class="group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
            <span class="error-text" id="err-email"></span>
        </div>

        <div class="group">
            <label for="username">Username (3–16 letters, numbers, or _)</label>
            <input id="username" name="username" type="text" />
            <span class="error-text" id="err-username"></span>
        </div>

        
      </form>
    </div>
  </main>
</body>
</html>
